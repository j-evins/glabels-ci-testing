name: Create snapshot snap

on:
  workflow_run:
    workflows: ["Create Snapshot"]
    types:
      - completed

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find latest prerelease
        id: get_release
        uses: cardinalby/git-get-release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up and run Snapcraft
        id: snapcraft
        uses: snapcore/action-build@v1

      - name: Upload Release Asset
        id: upload-release-asset 
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_path: ./${{ steps.snapcraft.outputs.snap }}
          asset_name: ${{ steps.snapcraft.outputs.snap }}
          asset_content_type: application/vnd.snap
